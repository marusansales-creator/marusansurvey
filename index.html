<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>丸三老舗 来店アンケート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root{
  --washi:#F2EEE2;
  --washi-deep:#E8E0CB;
  --sumi:#2A2724;
  --sumi-soft:#5C574F;
  --ai:#24425A;
  --ai-dark:#152C3B;
  --suou:#7A3B45;
  --suou-dark:#5E2C34;
  --matcha:#5F7357;
  --matcha-dark:#4A5A43;
  --line:#D9D0BB;
  --white:#FFFDF8;
}

*{box-sizing:border-box;margin:0;padding:0;}

.survey-root{
  font-family:'Zen Kaku Gothic New',sans-serif;
  color:var(--sumi);
  background:var(--washi);
  width:100%;
  min-height:600px;
  height:100vh;
  max-height:900px;
  position:relative;
  overflow:hidden;
  border-radius:4px;
  display:flex;
  flex-direction:column;
}

/* faint hemp-leaf (麻の葉) texture, used only on bookend screens */
.texture{
  position:absolute;inset:0;
  opacity:0.05;
  pointer-events:none;
  background-image:
    linear-gradient(30deg, var(--sumi) 12%, transparent 12.5%, transparent 87%, var(--sumi) 87.5%, var(--sumi)),
    linear-gradient(150deg, var(--sumi) 12%, transparent 12.5%, transparent 87%, var(--sumi) 87.5%, var(--sumi)),
    linear-gradient(30deg, var(--sumi) 12%, transparent 12.5%, transparent 87%, var(--sumi) 87.5%, var(--sumi)),
    linear-gradient(150deg, var(--sumi) 12%, transparent 12.5%, transparent 87%, var(--sumi) 87.5%, var(--sumi));
  background-size:52px 90px;
  background-position:0 0, 0 0, 26px 45px, 26px 45px;
}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 28px 14px;
  position:relative;z-index:2;
}
.brand{
  font-family:'Shippori Mincho',serif;
  font-size:15px;
  letter-spacing:0.14em;
  color:var(--sumi-soft);
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 32px;
  opacity:0;
  transform:translateY(14px);
  pointer-events:none;
  transition:opacity 0.38s ease, transform 0.38s ease;
}
.screen.active{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

/* ---- idle screen ---- */
.idle-mark{
  width:64px;height:64px;
  border:1.5px solid var(--ai);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;
  font-size:26px;
  color:var(--ai);
  margin-bottom:28px;
}
.idle-title{
  font-family:'Shippori Mincho',serif;
  font-size:30px;
  font-weight:700;
  letter-spacing:0.06em;
  margin-bottom:10px;
  text-align:center;
}
.idle-sub{
  font-size:17px;
  color:var(--sumi-soft);
  margin-bottom:40px;
  text-align:center;
  line-height:1.9;
}
.start-btn{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:20px;
  font-weight:700;
  letter-spacing:0.08em;
  color:var(--white);
  background:var(--ai);
  border:none;
  border-radius:3px;
  padding:22px 56px;
  cursor:pointer;
  transition:background 0.15s ease, transform 0.1s ease;
}
.start-btn:active{background:var(--ai-dark);transform:scale(0.98);}

/* ---- question screens ---- */
.q-eyebrow{
  font-size:15px;
  letter-spacing:0.2em;
  color:var(--suou);
  font-weight:700;
  margin-bottom:18px;
}
.q-title{
  font-family:'Shippori Mincho',serif;
  font-size:30px;
  font-weight:700;
  text-align:center;
  margin-bottom:10px;
  letter-spacing:0.03em;
}
.q-underline{display:block;margin:0 auto 34px;}
.q-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  width:100%;
  max-width:760px;
}
.q-grid.cols-1{
  grid-template-columns:1fr;
  max-width:560px;
}
.q-grid.odd-last .q-btn:last-child{
  grid-column:1 / -1;
}
.q-btn{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:22px;
  font-weight:500;
  color:var(--sumi);
  background:var(--white);
  border:1.5px solid var(--line);
  border-radius:4px;
  padding:30px 16px;
  min-height:130px;
  cursor:pointer;
  line-height:1.5;
  transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.q-btn:active{transform:scale(0.98);}
.q-btn.selected{
  background:var(--suou);
  border-color:var(--suou);
  color:var(--white);
}
.progress-dots{
  display:flex;gap:8px;margin-top:36px;
}
.progress-dots span{
  width:6px;height:6px;border-radius:50%;
  background:var(--line);
}
.progress-dots span.done{background:var(--suou);}

/* ---- thanks screen ---- */
.thanks-mark{
  width:74px;height:74px;
  border:1.5px solid var(--matcha);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:26px;
}
.thanks-mark svg{width:30px;height:30px;}
.thanks-title{
  font-family:'Shippori Mincho',serif;
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
}
.thanks-sub{font-size:16px;color:var(--sumi-soft);}

/* ---- staff/results screen ---- */
.staff-screen{align-items:stretch;justify-content:flex-start;padding:26px 28px 90px;overflow-y:auto;}
.staff-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.staff-title{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;}
.staff-count{font-size:12px;color:var(--sumi-soft);}
.staff-tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.tab-btn{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:12.5px;font-weight:700;
  padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--white);color:var(--sumi-soft);cursor:pointer;
}
.tab-btn.active{background:var(--ai);border-color:var(--ai);color:var(--white);}
.period-select{
  margin-top:14px;width:100%;
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:14px;padding:10px 12px;border-radius:4px;border:1.5px solid var(--line);
  background:var(--white);color:var(--sumi);
}
.staff-block{margin-top:26px;}
.staff-q{font-size:13px;font-weight:700;color:var(--suou);margin-bottom:12px;letter-spacing:0.02em;}
.bar-row{margin-bottom:11px;}
.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.bar-track{height:9px;background:var(--washi-deep);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--ai);border-radius:5px;transition:width 0.5s ease;}
.list-row{
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:13px;line-height:1.7;
}
.list-row .list-date{color:var(--suou);font-weight:700;font-size:12px;margin-bottom:2px;}
.sync-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:18px;padding:12px 14px;
  background:var(--white);border:1.5px solid var(--line);border-radius:4px;
}
.sync-text{font-size:12px;color:var(--sumi-soft);line-height:1.6;}
.sync-btn{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:12.5px;font-weight:700;
  padding:9px 14px;border-radius:20px;border:none;
  background:var(--matcha);color:var(--white);cursor:pointer;
  white-space:nowrap;
}
.sync-btn:disabled{opacity:0.5;}
.staff-footer{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;gap:12px;
  padding:16px 28px 22px;
  background:linear-gradient(to top, var(--washi) 60%, transparent);
}
.staff-btn{
  flex:1;
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:14px;font-weight:700;
  padding:14px;border-radius:3px;border:none;cursor:pointer;
}
.staff-btn.back{background:var(--white);border:1.5px solid var(--line);color:var(--sumi);}
.staff-btn.reset{background:var(--suou-dark);color:var(--white);}

/* ---- modal ---- */
.modal-overlay{
  position:absolute;inset:0;background:rgba(20,18,16,0.45);
  display:flex;align-items:center;justify-content:center;
  z-index:10;opacity:0;pointer-events:none;transition:opacity 0.2s ease;
}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--white);border-radius:6px;padding:28px 26px;
  width:82%;max-width:340px;text-align:center;
}
.modal-box p{font-size:14px;line-height:1.8;margin-bottom:22px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{
  flex:1;padding:12px;border-radius:3px;font-size:13px;font-weight:700;
  font-family:'Zen Kaku Gothic New',sans-serif;border:none;cursor:pointer;
}
.modal-cancel{background:var(--washi-deep);color:var(--sumi);}
.modal-confirm{background:var(--suou-dark);color:var(--white);}

.empty-note{font-size:13px;color:var(--sumi-soft);margin-top:30px;text-align:center;line-height:1.8;}
</style>
</head>
<body>

<div class="survey-root" id="root">
  <div class="header">
    <div class="brand" id="brandMark">丸三老舗</div>
  </div>

  <!-- idle -->
  <div class="screen active" data-screen="idle">
    <div class="texture"></div>
    <div class="idle-mark">丸三</div>
    <div class="idle-title">アンケートにご協力ください</div>
    <div class="idle-sub">ボタンを4回タップするだけです。<br>今後のお店づくりの参考にさせていただきます。</div>
    <button class="start-btn" id="startBtn">はじめる</button>
  </div>

  <!-- questions injected here -->
  <div id="questionScreens"></div>

  <!-- thanks -->
  <div class="screen" data-screen="thanks">
    <div class="texture"></div>
    <div class="thanks-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 13l5 5L20 6" stroke="#5F7357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="thanks-title">ありがとうございました</div>
    <div class="thanks-sub">またのご来店をお待ちしております</div>
  </div>

  <!-- staff results -->
  <div class="screen staff-screen" data-screen="staff">
    <div class="staff-head">
      <div class="staff-title">集計結果</div>
      <div class="staff-count" id="staffCount">回答数 0件</div>
    </div>
    <div class="staff-tabs" id="staffTabs">
      <button class="tab-btn active" data-mode="all">全期間</button>
      <button class="tab-btn" data-mode="month">月別</button>
      <button class="tab-btn" data-mode="day">日別</button>
      <button class="tab-btn" data-mode="list">回答ごと</button>
    </div>
    <select class="period-select" id="periodSelect" style="display:none;"></select>
    <div id="staffBody"></div>
    <div class="sync-row">
      <div class="sync-text" id="syncText">スプレッドシートと同期できます</div>
      <button class="sync-btn" id="syncBtn">スプレッドシートに同期</button>
    </div>
    <div class="staff-footer">
      <button class="staff-btn back" id="staffBack">閉じる</button>
      <button class="staff-btn reset" id="staffReset">集計をリセット</button>
    </div>
  </div>

  <!-- reset confirm modal -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal-box">
      <p>これまでの回答データをすべて削除します。<br>この操作は取り消せません。よろしいですか？</p>
      <div class="modal-actions">
        <button class="modal-cancel" id="resetCancel">キャンセル</button>
        <button class="modal-confirm" id="resetConfirm">削除する</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ▼▼▼ ここをFirebaseコンソールでコピーした設定に書き換えてください ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBT5-AG4ezgp9WED6p--GvqxUZEjVPu8bQ",
  authDomain: "marusansurvey.firebaseapp.com",
  projectId: "marusansurvey",
  storageBucket: "marusansurvey.firebasestorage.app",
  messagingSenderId: "519404750384",
  appId: "1:519404750384:web:65354c69cce2858f2fcff5"
};
// ▲▲▲ ここまで ▲▲▲

// ▼▼▼ スプレッドシート同期用：Apps ScriptのウェブアプリURL ▼▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0LtoYQnaZGLyglfZ3JegxogLQBuYPWaMG43Fgl_MGsGf2981v4A9jtEalZhaRUqUc/exec";
// ▲▲▲ ここまで ▲▲▲

const COLLECTION_NAME = 'responses';
const isConfigured = firebaseConfig.apiKey !== 'YOUR_API_KEY';
const isSyncConfigured = GAS_URL !== 'YOUR_GAS_WEB_APP_URL';
let db = null;
if (isConfigured) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
}

async function saveResponse(record){
  if (!db) throw new Error('Firebase未設定');
  await addDoc(collection(db, COLLECTION_NAME), record);
}
async function loadAllResponses(){
  if (!db) return [];
  const snap = await getDocs(collection(db, COLLECTION_NAME));
  return snap.docs.map(d => d.data());
}
async function resetAllResponses(){
  if (!db) return;
  const snap = await getDocs(collection(db, COLLECTION_NAME));
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, COLLECTION_NAME, d.id))));
}

// Firestoreへの保存に加えて、スプレッドシートにも1件だけ書き込む（失敗しても無視）
async function syncOneToSheet(record){
  if (!isSyncConfigured) return;
  try {
    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(record) });
  } catch (e) {
    console.error('sheet sync failed', e);
  }
}

(function(){
  const QUESTIONS = [
    {
      id: 'visits',
      title: 'ご来店回数は？',
      options: ['はじめて','2回目','3回目〜']
    },
    {
      id: 'purpose',
      title: 'ご購入の目的は？',
      options: ['手土産・贈答用','ご自宅用']
    },
    {
      id: 'trigger',
      title: 'ご来店のきっかけは？',
      options: ['通りがかり','SNS（X・Instagram）','Googleマップ・レビュー','知人からの口コミ','以前から利用している']
    }
  ];

  const root = document.getElementById('root');
  const qContainer = document.getElementById('questionScreens');
  let draft = {};
  let currentIndex = 0;
  let allResponses = [];
  let viewMode = 'all';
  let selectedPeriod = null;

  if (!isConfigured) {
    const warn = document.createElement('div');
    warn.style.cssText = 'position:absolute;top:0;left:0;right:0;background:#7A3B45;color:#fff;font-size:12px;text-align:center;padding:6px;z-index:20;';
    warn.textContent = 'Firebase未設定です。コード内のfirebaseConfigを書き換えてください。';
    root.appendChild(warn);
  }

  // build question screens
  QUESTIONS.forEach((q, idx) => {
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.dataset.screen = 'q' + idx;

    const dots = QUESTIONS.map((_, i) => `<span class="${i < idx ? 'done' : ''}"></span>`).join('');

    screen.innerHTML = `
      <div class="q-eyebrow">問 ${idx + 1} / ${QUESTIONS.length}</div>
      <div class="q-title">${q.title}</div>
      <svg class="q-underline" width="120" height="10" viewBox="0 0 120 10">
        <path d="M2 6 C 20 2, 40 9, 60 5 S 100 2, 118 6" stroke="#7A3B45" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="q-grid ${q.options.length % 2 !== 0 ? 'odd-last' : ''}">
        ${q.options.map(opt => `<button class="q-btn" data-value="${opt}">${opt}</button>`).join('')}
      </div>
      <div class="progress-dots">${dots}</div>
    `;
    qContainer.appendChild(screen);

    screen.querySelectorAll('.q-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (screen.dataset.locked) return;
        screen.dataset.locked = '1';
        btn.classList.add('selected');
        draft[q.id] = btn.dataset.value;
        setTimeout(() => {
          screen.dataset.locked = '';
          btn.classList.remove('selected');
          currentIndex++;
          if (currentIndex < QUESTIONS.length) {
            showScreen('q' + currentIndex);
          } else {
            finishSurvey();
          }
        }, 260);
      });
    });
  });

  function showScreen(name){
    root.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = root.querySelector(`[data-screen="${name}"]`);
    if (target) target.classList.add('active');
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    draft = {};
    currentIndex = 0;
    showScreen('q0');
  });

  async function finishSurvey(){
    showScreen('thanks');
    const record = { ...draft, ts: Date.now() };
    try {
      await saveResponse(record);
    } catch (e) {
      console.error('survey save failed', e);
    }
    syncOneToSheet(record);
    setTimeout(() => showScreen('idle'), 3200);
  }

  // ---- staff results access: long-press brand mark ----
  const brand = document.getElementById('brandMark');
  let pressTimer = null;
  function startPress(){ pressTimer = setTimeout(openStaff, 1400); }
  function cancelPress(){ if (pressTimer) clearTimeout(pressTimer); }
  brand.addEventListener('mousedown', startPress);
  brand.addEventListener('touchstart', startPress);
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => brand.addEventListener(ev, cancelPress));

  async function openStaff(){
    showScreen('staff');
    viewMode = 'all';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'all'));
    document.getElementById('periodSelect').style.display = 'none';
    const body = document.getElementById('staffBody');
    body.innerHTML = '<div class="empty-note">読み込み中です…</div>';
    try {
      allResponses = await loadAllResponses();
    } catch (e) {
      allResponses = [];
    }
    render();
    document.getElementById('syncText').textContent = isSyncConfigured
      ? 'スプレッドシートと同期できます'
      : 'スプレッドシート同期は未設定です';
    document.getElementById('syncBtn').disabled = !isSyncConfigured;
  }

  function fmtDay(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }
  function fmtMonth(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}年${d.getMonth()+1}月`;
  }
  function dayKey(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function monthKey(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  function renderBars(list){
    if (list.length === 0) {
      return '<div class="empty-note">この期間の回答はありません。</div>';
    }
    return QUESTIONS.map(q => {
      const counts = {};
      q.options.forEach(o => counts[o] = 0);
      list.forEach(r => { if (r[q.id] && counts.hasOwnProperty(r[q.id])) counts[r[q.id]]++; });
      const total = list.length;
      const rows = q.options.map(o => {
        const c = counts[o];
        const pct = total ? Math.round((c / total) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="bar-label"><span>${o}</span><span>${c}件（${pct}%）</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>`;
      }).join('');
      return `<div class="staff-block"><div class="staff-q">${q.title}</div>${rows}</div>`;
    }).join('');
  }

  function renderList(list){
    if (list.length === 0) {
      return '<div class="empty-note">この期間の回答はありません。</div>';
    }
    const sorted = [...list].sort((a,b) => b.ts - a.ts);
    return sorted.map(r => `
      <div class="list-row">
        <div class="list-date">${fmtDay(r.ts)}</div>
        ${QUESTIONS.map(q => `${q.title.replace('？','')}：${r[q.id] || '－'}`).join('　/　')}
      </div>
    `).join('');
  }

  function render(){
    const body = document.getElementById('staffBody');
    const countEl = document.getElementById('staffCount');
    const select = document.getElementById('periodSelect');

    if (allResponses.length === 0) {
      countEl.textContent = '回答数 0件';
      select.style.display = 'none';
      body.innerHTML = '<div class="empty-note">まだ回答がありません。<br>お会計後にお客様にタップしていただくと、ここに集計が表示されます。</div>';
      return;
    }

    if (viewMode === 'all') {
      select.style.display = 'none';
      countEl.textContent = `回答数 ${allResponses.length}件`;
      body.innerHTML = renderBars(allResponses);
      return;
    }

    if (viewMode === 'list') {
      select.style.display = 'none';
      countEl.textContent = `回答数 ${allResponses.length}件`;
      body.innerHTML = renderList(allResponses);
      return;
    }

    // month or day: build period options
    const keyFn = viewMode === 'month' ? monthKey : dayKey;
    const labelFn = viewMode === 'month' ? fmtMonth : fmtDay;
    const keys = [...new Set(allResponses.map(r => keyFn(r.ts)))].sort().reverse();

    if (!selectedPeriod || !keys.includes(selectedPeriod)) selectedPeriod = keys[0];

    select.style.display = 'block';
    select.innerHTML = keys.map(k => {
      const sample = allResponses.find(r => keyFn(r.ts) === k);
      return `<option value="${k}" ${k === selectedPeriod ? 'selected' : ''}>${labelFn(sample.ts)}</option>`;
    }).join('');

    const filtered = allResponses.filter(r => keyFn(r.ts) === selectedPeriod);
    countEl.textContent = `回答数 ${filtered.length}件（全${allResponses.length}件中）`;
    body.innerHTML = renderBars(filtered);
  }

  document.getElementById('staffTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    viewMode = btn.dataset.mode;
    selectedPeriod = null;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  document.getElementById('periodSelect').addEventListener('change', (e) => {
    selectedPeriod = e.target.value;
    render();
  });

  document.getElementById('staffBack').addEventListener('click', () => showScreen('idle'));

  // ---- 過去データをまとめてスプレッドシートに反映 ----
  document.getElementById('syncBtn').addEventListener('click', async () => {
    const text = document.getElementById('syncText');
    if (!isSyncConfigured) {
      text.textContent = 'スプレッドシート同期は未設定です';
      return;
    }
    if (allResponses.length === 0) {
      text.textContent = '同期する回答がありません';
      return;
    }
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.textContent = '同期中…';
    let ok = 0;
    let ng = 0;
    for (const r of allResponses) {
      text.textContent = `同期中… ${ok + ng + 1}/${allResponses.length}件`;
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(r) });
        const body = await res.text();
        const json = JSON.parse(body);
        if (json.status === 'ok') { ok++; } else { ng++; }
      } catch (e) {
        console.error('sync failed for one record', e);
        ng++;
      }
    }
    btn.textContent = 'スプレッドシートに同期';
    btn.disabled = false;
    if (ng === 0) {
      text.style.color = '';
      text.textContent = `${ok}件をスプレッドシートに反映しました`;
    } else {
      text.style.color = '#7A3B45';
      text.textContent = `成功${ok}件・失敗${ng}件（Apps Scriptの再デプロイが必要な可能性があります）`;
    }
  });

  const resetModal = document.getElementById('resetModal');
  document.getElementById('staffReset').addEventListener('click', () => resetModal.classList.add('active'));
  document.getElementById('resetCancel').addEventListener('click', () => resetModal.classList.remove('active'));
  document.getElementById('resetConfirm').addEventListener('click', async () => {
    try {
      await resetAllResponses();
    } catch (e) {
      console.error('reset failed', e);
    }
    resetModal.classList.remove('active');
    openStaff();
  });
})();
</script>

</body>
</html>
